name: Update Scammer Gallery

on:
  push:
    paths:
      - "assets/scammers/**"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate scammer manifest
        run: python3 tools/generate_scammer_manifest.py

      - name: Commit gallery manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scammers/index.json
          git diff --cached --quiet || git commit -m "Update scammer gallery"
          git push

name: Update Scammer Gallery

on:
  push:
    paths:
      - "assets/scammers/**/*.png"
      - "assets/scammers/**/*.jpg"
      - "assets/scammers/**/*.jpeg"
      - "assets/scammers/**/*.webp"
      - "assets/scammers/**/*.gif"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate gallery manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("assets/scammers")
          allowed = {".png", ".jpg", ".jpeg", ".webp", ".gif"}
          items = []

          for p in sorted(root.rglob("*")):
              if p.is_file() and p.suffix.lower() in allowed:
                  # Turn filename into a readable title.
                  title = p.stem.replace("_", " ").replace("-", " ").strip()
                  title = " ".join(title.split()).title()
                  items.append({
                      "src": p.as_posix(),
                      "title": title or "Scammer Report"
                  })

          (root / "index.json").write_text(
              json.dumps(items, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit gallery manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scammers/index.json
          git diff --cached --quiet || git commit -m "Update scammer gallery"
          git push

<title>DIBOXE LEGIT — Scammers</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;background:#07080e;color:#eef0f7;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
  background-image:linear-gradient(rgba(91,100,160,.10) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(91,100,160,.10) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:linear-gradient(to bottom,black 0%,rgba(0,0,0,.7) 55%,transparent 100%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,rgba(65,108,255,.11),transparent 36%);
}
nav{
  height:65px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 31px;background:rgba(7,8,14,.84);backdrop-filter:blur(14px);
  position:relative;z-index:2;
}
.brand{display:flex;align-items:center;gap:14px}
.avatar{
  width:36px;height:36px;border:1px solid #34406d;border-radius:10px;
  display:grid;place-items:center;font-size:11px;font-weight:900;color:#8eb0ff;
  background:#0d1020;box-shadow:0 0 20px rgba(75,111,255,.12)
}
.brand-name{font-weight:800;font-size:15px}
.brand-sub{font-size:10px;letter-spacing:3px;color:#656b84;margin-top:4px}
.navlinks{display:flex;gap:8px}
.navbtn{
  color:#cbd0e3;text-decoration:none;padding:9px 15px;border-radius:9px;
  border:1px solid transparent;font-size:13px;font-weight:600;transition:.2s
}
.navbtn:hover,.navbtn.active{background:#1a1d28;border-color:#282d40}
.navbtn.social{color:#9bb1ff;border-color:#303b77;background:#0e1225}
main{position:relative;z-index:1;max-width:1050px;margin:auto;padding:56px 22px 90px}
.corner{position:absolute;width:33px;height:33px;border-color:#29315d}
.c1{left:8px;top:32px;border-left:1px solid;border-top:1px solid}
.c2{right:8px;top:32px;border-right:1px solid;border-top:1px solid}
.status{
  width:max-content;margin:0 auto 22px;padding:8px 15px;border-radius:20px;
  border:1px solid #25283a;background:rgba(18,19,29,.75);
  color:#858ba4;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px
}
.dot{display:inline-block;width:8px;height:8px;background:#19d56b;border-radius:50%;
  margin-right:8px;box-shadow:0 0 10px #19d56b}
.hero{text-align:center}
h1{
  font-size:clamp(48px,8vw,82px);line-height:1.02;letter-spacing:-3px;
  font-weight:900;margin:0 auto 24px
}
h1 .accent{color:#5c9cff;text-shadow:0 0 30px rgba(92,156,255,.18)}
h1 .muted{color:#858792}
.tagline{
  color:#74788a;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:4px;margin-bottom:28px
}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.pill{
  border:1px solid #222633;background:#0d0f17;border-radius:20px;
  padding:9px 14px;color:#b2b6c5;font-size:12px
}
.cta{
  display:inline-flex;align-items:center;gap:12px;text-decoration:none;
  color:#b9c8ff;border:1px solid #39458e;background:#11152e;
  border-radius:24px;padding:12px 22px;font-weight:700;font-size:14px;
  box-shadow:0 12px 35px rgba(55,82,190,.17);transition:.25s
}
.cta:hover{transform:translateY(-2px);border-color:#5b72dc;box-shadow:0 15px 45px rgba(55,82,190,.3)}
section{margin-top:72px}
.section-title{text-align:center;color:#7b8095;font:11px ui-monospace,monospace;letter-spacing:4px;margin-bottom:20px}
.about{
  max-width:780px;margin:auto;text-align:center;color:#a7abba;line-height:1.85;
  font-size:15px
}
.about b{color:#dfe3ef}
.socials{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:800px;margin:0 auto
}
.card{
  text-decoration:none;color:#e8eaf2;border:1px solid #202435;background:rgba(13,15,23,.8);
  border-radius:14px;padding:18px;display:flex;align-items:center;gap:13px;
  transition:.2s;position:relative;overflow:hidden
}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(92,156,255,.08),transparent 45%);opacity:0;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#38436c}
.card:hover:before{opacity:1}
.icon{
  width:40px;height:40px;border-radius:11px;background:#111524;border:1px solid #292f49;
  display:grid;place-items:center;font-size:17px;font-weight:800;color:#9bb1ff;position:relative;flex:none
}
.card strong{font-size:14px;display:block}.card span{font-size:11px;color:#70768c}
footer{text-align:center;margin-top:70px;color:#4f5467;font:10px ui-monospace,monospace;letter-spacing:2px}
@media(max-width:700px){
  nav{padding:0 16px}.brand-sub{display:none}.navbtn{padding:8px 10px}
  main{padding-top:48px}.socials{grid-template-columns:1fr}
  h1{letter-spacing:-2px}.tagline{letter-spacing:2px}
}

.logo{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  position:relative;overflow:hidden;flex:none;
  background:linear-gradient(145deg,#111a39,#0b0e1b);
  border:1px solid #4056a1;color:#9bb7ff;
  font-weight:950;font-size:13px;letter-spacing:-1px;
  box-shadow:0 0 0 1px rgba(91,137,255,.08),0 0 22px rgba(73,111,255,.24);
  animation:logoPulse 2.8s ease-in-out infinite;
}
.logo:before{
  content:"";position:absolute;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(112,159,255,.45);animation:logoRing 2.8s linear infinite;
}
.logo span{position:relative;z-index:2}
@keyframes logoPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(91,137,255,.08),0 0 18px rgba(73,111,255,.20)}
  50%{box-shadow:0 0 0 1px rgba(91,137,255,.18),0 0 32px rgba(73,111,255,.42)}
}
@keyframes logoRing{to{transform:rotate(360deg) scale(1.18);opacity:.25}}
@keyframes heroGlow{
  0%,100%{text-shadow:0 0 12px rgba(92,156,255,.08)}
  50%{text-shadow:0 0 34px rgba(92,156,255,.22)}
}
h1{animation:heroGlow 3.5s ease-in-out infinite}
.status{animation:statusGlow 2.5s ease-in-out infinite}
@keyframes statusGlow{
  0%,100%{box-shadow:0 0 0 rgba(25,213,107,0)}
  50%{box-shadow:0 0 22px rgba(25,213,107,.08)}
}
.dot{animation:dotPulse 1.8s ease-in-out infinite}
@keyframes dotPulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.35);opacity:.72}
}
.card:hover .icon{box-shadow:0 0 18px rgba(92,156,255,.18)}

/* Loading screen */
#loader{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;
  background:#030305;transition:opacity .7s ease,visibility .7s ease;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-box{text-align:center}
.loader-logo{
  width:105px;height:105px;border-radius:50%;object-fit:cover;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 0 0 1px rgba(255,40,40,.08),0 0 30px rgba(255,25,25,.28);
  animation:loaderPulse 1.8s ease-in-out infinite;
}
.loader-ring{
  width:135px;height:135px;border:2px solid rgba(255,255,255,.08);
  border-top-color:#ff3030;border-right-color:#ff3030;border-radius:50%;
  margin:-120px auto 30px;animation:spin .9s linear infinite;
}
.loader-title{
  margin-top:25px;font-size:15px;font-weight:900;letter-spacing:4px;color:#f1f2f6;
}
.loader-sub{
  margin-top:8px;color:#666b7d;font:10px ui-monospace,monospace;letter-spacing:3px;
}
.loader-bar{
  width:170px;height:3px;background:#151720;border-radius:10px;overflow:hidden;margin:17px auto 0;
}
.loader-bar span{
  display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2020,#6c8fff);
  box-shadow:0 0 12px rgba(255,40,40,.55);animation:loadBar 1.7s ease forwards;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loaderPulse{
  0%,100%{transform:scale(1);filter:brightness(.95)}
  50%{transform:scale(1.05);filter:brightness(1.18)}
}
@keyframes loadBar{to{width:100%}}
.nav-logo{
  width:38px;height:38px;border-radius:10px;object-fit:cover;display:block;
  border:1px solid #3d4261;
  box-shadow:0 0 16px rgba(255,35,35,.18);
  transition:.25s;
}
.nav-logo:hover{transform:scale(1.06);box-shadow:0 0 24px rgba(255,35,35,.34)}

.music-control{position:fixed;right:18px;bottom:18px;z-index:20;width:46px;height:46px;border-radius:50%;border:1px solid #39458e;background:#11152e;color:#b9c8ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 22px rgba(55,82,190,.22);transition:.25s;font-size:17px}
.music-control:hover{transform:scale(1.08);border-color:#6077df;box-shadow:0 0 30px rgba(80,110,255,.35)}
.sound-hint{position:fixed;right:73px;bottom:25px;z-index:20;padding:8px 12px;border-radius:12px;background:#0d0f18;border:1px solid #272d43;color:#8d93a8;font:10px ui-monospace,monospace;letter-spacing:1px;opacity:0;transform:translateX(8px);pointer-events:none;transition:.25s}
.sound-hint.show{opacity:1;transform:translateX(0)}

/* Mouse cursor effects */
.cursor-glow{
  position:fixed;left:0;top:0;width:260px;height:260px;border-radius:50%;
  pointer-events:none;z-index:9997;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(82,130,255,.12) 0%,rgba(82,130,255,.045) 28%,transparent 68%);
  filter:blur(2px);mix-blend-mode:screen;transition:opacity .25s;
}
.cursor-dot{
  position:fixed;left:0;top:0;width:7px;height:7px;border-radius:50%;
  pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  background:#8eb1ff;box-shadow:0 0 12px #5f8cff,0 0 25px rgba(95,140,255,.55);
}
.cursor-ring{
  position:fixed;left:0;top:0;width:30px;height:30px;border:1px solid rgba(123,157,255,.7);
  border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  transition:width .18s,height .18s,border-color .18s,background .18s;
}
.cursor-ring.hover{
  width:48px;height:48px;border-color:rgba(142,174,255,.95);
  background:rgba(92,137,255,.07);box-shadow:0 0 22px rgba(92,137,255,.22);
}
.cursor-spark{
  position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9996;
  background:#78a3ff;box-shadow:0 0 10px rgba(95,140,255,.85);
  animation:sparkFade .65s ease-out forwards;
}
@keyframes sparkFade{
  0%{opacity:.9;transform:scale(1) translate(0,0)}
  100%{opacity:0;transform:scale(.15) translate(var(--dx),var(--dy))}
}
@media (pointer:coarse){
  .cursor-glow,.cursor-dot,.cursor-ring,.cursor-spark{display:none}
}
